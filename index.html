<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Signage</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    video {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    /* Caption styling — sized for viewing distance, not a desktop monitor */
    video::cue {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 3.2vh;
      line-height: 1.35;
      color: #fff;
      background: rgba(0, 0, 0, 0.72);
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
    }
  </style>
</head>

      "https://assets.churchofjesuschrist.org/2ok7kmtro4hoxmquyfjobeq1oi94rk9d7bkufmfv-1080p-en.mp4",
      "https://assets.churchofjesuschrist.org/v63z00q4igqlctjjh4g8qzivetmdx0jplmc7dkkr-1080p-en.mp4",
      "https://assets.churchofjesuschrist.org/8ilv3jsvb5p4nlliqat8waq55s5fa896jo1wu512-1080p-en.mp4",
      "https://assets.churchofjesuschrist.org/xxj8e4y49zu4k5nd5jn6j11dcty0rqbqb8tk2qkl-1080p-en.mp4",
      "https://assets.churchofjesuschrist.org/kaac7kdxwtpab30mwqqeursgbpy62eln9fr7cv98-1080p-en.mp4",
      "https://assets.churchofjesuschrist.org/yysfmfl8l4eojgprfhuw6rvi6rkexhljfs5hppnw-1080p-en.mp4",
      "https://assets.churchofjesuschrist.org/f18htn2l9t8197r523l2cli46ktkyynbuqk1tcnh-1080p-en.mp4",
      "https://assets.churchofjesuschrist.org/0bit5y2gd2z5126reh1p1a25hb7yrskg2p5but0n-1080p-en.mp4",
      "https://assets.churchofjesuschrist.org/f35fbahquixjbq9qs4g6d3n97d9pqlkmqn6r6mz3-1080p-en.mp4",
      "https://assets.churchofjesuschrist.org/jly1je8zrx1chygo3b8k2ssqbbawj2l2t5eku3t2-1080p-en.mp4",
      "https://assets.churchofjesuschrist.org/w7tqh4gqrzmindbkac39v7oesianpxt1jtndzohy-1080p-en.mp4",
      "https://assets.churchofjesuschrist.org/5cmtuyurp92hdt2qxaonltowlprbzzy1xx55hhpc-1080p-en.mp4",
      "https://assets.churchofjesuschrist.org/qodokyins6ds2gxnk9xt5lhqokclzdyd7wq9td7b-1080p-en.mp4",
      "https://assets.churchofjesuschrist.org/oizf2pq7ffeo459z5a6yl2f6l5wpeluu098a2grb-1080p-en.mp4",
      "https://assets.churchofjesuschrist.org/xq8ly54wyayaf2snqzi0886yj2bb27g83v90rjsy-1080p-en.mp4",
      "https://assets.churchofjesuschrist.org/9j2bd7wocy7rz7si6odbv0jvegmpa6tx0kz3sor6-1080p-en.mp4"
    ];

    // Captions live in ./captions/<assetHash>.vtt. The hash is already in each
    // MP4 URL, so the path is derived rather than maintained by hand. A missing
    // file just plays uncaptioned.
    //
    // These MUST be local files. The caption source (Brightcove) serves signed,
    // expiring URLs with no CORS headers, so a remote <track> cannot work.
    function captionFor(mp4Url) {
      const m = mp4Url.match(/\/([a-z0-9]+)-\d+p-en\.mp4$/);
      return m ? `captions/${m[1]}.vtt` : null;
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    const shuffled = shuffle([...playlist]);
    let index = 0;
    const v = document.getElementById('v');

    function advance() {
      index++;
      if (index >= shuffled.length) {
        index = 0;
        shuffle(shuffled);
      }
    }

    function playNext() {
      const url = shuffled[index];
      const cc = captionFor(url);

      // Clear the previous <track> before loading the next clip
      while (v.firstChild) v.removeChild(v.firstChild);

      v.src = url;

      if (cc) {
        const t = document.createElement('track');
        t.kind = 'captions';
        t.srclang = 'en';
        t.label = 'English';
        t.src = cc;
        t.default = true;
        v.appendChild(t);
        // The default attribute alone is unreliable when swapping src at
        // runtime, so force the track on once it's parsed.
        const show = () => { if (t.track) t.track.mode = 'showing'; };
        t.addEventListener('load', show);
        v.addEventListener('loadedmetadata', show, { once: true });
      }

      markProgress();
      v.muted = true;
      v.play().then(() => { v.muted = false; }).catch(() => {});
      advance();
    }

    v.addEventListener('ended', playNext);

    // Don't let one dead URL freeze the wall — skip to the next clip
    v.addEventListener('error', () => setTimeout(playNext, 1000));

    // Stall watchdog. A clip that hangs mid-buffer fires 'waiting'/'stalled'
    // but never 'error' or 'ended', so neither handler above runs and the
    // display freezes with paused === false — verified in Chromium, where
    // currentTime simply stops advancing. This is the only recovery path for
    // that case. 20s of zero progress is definitively broken, while still
    // being generous enough that slow buffering doesn't cause skipping.
    const STALL_MS = 20000;
    const CHECK_MS = 5000;
    let lastTime = -1;
    let lastProgress = Date.now();

    function markProgress() {
      lastTime = v.currentTime;
      lastProgress = Date.now();
    }

    setInterval(() => {
      if (v.currentTime !== lastTime) { markProgress(); return; }
      if (Date.now() - lastProgress < STALL_MS) return;
      markProgress();
      playNext();
    }, CHECK_MS);

    playNext();
  </script>
</body>
</html>
